# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      gh-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
